name: Deploy character preview to GitHub Pages (manual)

# Deliberately no push/PR trigger. Publishing requires a separate manual action.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: character-pages
  cancel-in-progress: false

jobs:
  build:
    # Only publish reviewed code from the repository's default branch.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify static entry points
        run: |
          test -s web/index.html
          test -s web/style.css
          test -s web/app.mjs
          test -s web/character.mjs
          test -s web/assets/character/character.svg
          test -s web/assets/character/manifest.json
          node --test tests/browser/runtime.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy after manual dispatch
        id: deployment
        uses: actions/deploy-pages@v4
